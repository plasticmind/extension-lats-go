<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LATS Go!</title>
  <link rel="stylesheet" href="styles/nysds-tokens.css">
  <link rel="stylesheet" href="styles/ui.css">
</head>
<body class="lg lg-popup">
  <header class="lg-brand">
    <img src="images/icon32.png" alt="" width="28" height="28">
    <h1 class="lg-title">LATS Go!</h1>
    <button type="button" id="editSchedule" class="lg-button lg-button--primary lg-button--small lg-brand__action">Edit schedule</button>
  </header>

  <section aria-labelledby="scheduleHeading">
    <h2 id="scheduleHeading" class="lg-heading">Your schedule</h2>
    <div id="scheduleSummary"></div>
  </section>

  <p class="lg-hint lg-popup-footnote">Open a LATS timesheet and select Fill Timecard to use this schedule.</p>

  <script src="scripts/shared/utils.js"></script>
  <script src="scripts/popup.js"></script>
</body>
</html>
